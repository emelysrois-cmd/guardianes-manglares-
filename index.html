<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Guardianes del Manglar</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f7f4; }
        header { background: #1b4332; color: white; padding: 50px; }
        .btn-download { background: #40916c; color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 20px; }
        .section { padding: 40px; }
    </style>
</head>
<body>
    <header>
        <h1>Guardianes del Manglar</h1>
        <p>Innovación para La Guajira</p>
    </header>

    <div class="section">
        <h2>Manual del Guardián</h2>
        <p>Descarga nuestra guía para cuidar el manglar:</p>
        <a href="manual.pdf" class="btn-download" download>Descargar Manual (PDF)</a>
    </div>

    <div id="reporte" class="section">
        <h2>Reportar Estado del Mangle</h2>
        <form action="https://formspree.io/f/xnjyzndn" method="POST">
            <input type="text" name="nombre" placeholder="Tu nombre" required><br><br>
            <textarea name="mensaje" placeholder="Describe el problema..." required></textarea><br><br>
            <button type="submit">Enviar Reporte</button>
        </form>
    </div>
</body>
</html>
