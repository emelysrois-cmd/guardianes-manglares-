
<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #F4E4BC; color: #1B4332; }
        .hero { text-align: center; padding: 50px; }
        .btn-green { background-color: #2D9CDB; color: white; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; }
        .card { background: white; padding: 20px; border-radius: 12px; margin: 20px; display: inline-block; width: 250px; }
    </style>
</head>
<body>
    <header class="hero">
        <h1>Guardianes del Manglar</h1>
        <p>Innovación tecnológica para la conservación en La Guajira.</p>
        <button class="btn-green">Adoptar un Mangle</button>
    </header>

    <section style="text-align: center;">
        <div class="card">
            <h3>Nivel de Oxígeno</h3>
            <p>98% - Óptimo</p>
        </div>
        <div class="card">
            <h3>Mangles Plantados</h3>
            <p>1,240 unidades</p>
        </div>
    </section>
</body>
</html>
